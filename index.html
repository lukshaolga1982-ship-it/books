<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказ тетрадей — Браславская гимназия</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login" class="login"><form id="loginForm"><div class="logo">БГ</div><p>Браславская гимназия имени И. Н. Волчкова</p><h1>Заказ рабочих тетрадей</h1><label>Электронная почта<input id="email" type="email" value="lukshaolga1982@gmail.com" required></label><label>Пароль<input id="password" type="password" required></label><button>Войти</button><small id="loginError"></small></form></section>
<main id="app" hidden><header><div class="logo">БГ</div><div><p>Браславская гимназия имени И. Н. Волчкова</p><h1>Заказ рабочих тетрадей</h1></div><span id="saveStatus">Загрузка…</span><button id="logout">Выйти</button></header><section id="summary" class="summary"></section><div class="layout"><aside><div class="asideHead"><b>Классы и группы</b><button id="addUnit">+</button></div><nav id="units"></nav><button class="wide" id="addUnitBottom">＋ Добавить класс или группу</button></aside><section id="content" class="content"></section></div></main>
<dialog id="unitDialog"><form method="dialog" id="unitForm"><button class="close" value="cancel">×</button><h2>Новый класс или группа</h2><div class="switch"><button type="button" data-type="class" class="active">Класс</button><button type="button" data-type="group">Учебная группа</button></div><label>Название<input id="unitName" placeholder="Например, 5А" required></label><div class="row"><label>Параллель<select id="unitGrade"></select></label><label>Учащихся<input id="unitStudents" type="number" min="0" value="25"></label></div><button class="primary" value="default">Создать список</button></form></dialog>
<script src="catalog.js"></script><script type="module" src="app.js"></script></body></html>
